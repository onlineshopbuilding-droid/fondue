<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Name under the home screen icon, with the version, so each build on the site is its own app. Filled in by vite.config.ts. -->
    <meta name="apple-mobile-web-app-title" content="%APP_TITLE%" />
    <meta name="application-name" content="%APP_TITLE%" />
    <meta name="theme-color" content="#1c2a33" />
    <!-- Filled in by vite.config.ts from src/config/game.ts; main.ts sets it again at run time. -->
    <title>%GAME_NAME%</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
