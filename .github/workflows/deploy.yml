name: Deploy to GitHub Pages

# One site, several builds:
#   /fondue/          the game from main
#   /fondue/classic/  the frozen alpha from the branch "classic" (tag v0-alpha)
#   /fondue/dev/      the developer overview, one HTML file from scripts/dev-page.ts
# Each build needs its own base path, otherwise its files do not load.
# After a change on "classic", start this workflow by hand (Run workflow, branch main).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # The Pages environment only accepts deployments that run from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      # Generated from the config files after the game build (which empties dist/), so it is never out of date.
      - name: Build the developer overview into /dev/
        run: npm run dev-page

      - name: Check out the classic version
        uses: actions/checkout@v4
        with:
          ref: classic
          path: .classic-src
      - name: Build the classic version into /classic/
        working-directory: .classic-src
        run: |
          npm ci
          npx vite build --base=/fondue/classic/ --outDir ../dist/classic --emptyOutDir

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
